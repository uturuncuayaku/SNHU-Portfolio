<div class="container my-4">
  <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
    <div>
      <h2 class="fw-bold text-dark mb-1">Travlr Trips Directory</h2>
      <p class="text-muted mb-0">{{ message }}</p>
    </div>
    <button *ngIf="isLoggedIn()" class="btn btn-success btn-lg shadow-sm" (click)="addTrip()">
      <i class="bi bi-plus-circle me-2"></i>+ Add New Trip
    </button>
  </div>

  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
    <div class="col" *ngFor="let trip of trips">
      <app-trip-card [trip]="trip"></app-trip-card>
    </div>
  </div>
</div>
